name: Déploiement Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reconstruction quotidienne : `prebuild` relève les chiffres de la
  # mobilisation sur 26septembre.org et les fige dans le HTML statique.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Build statique
        run: npm run build

      - name: Déployer sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=onveutvivre
            --branch=${{ github.head_ref || github.ref_name }}
